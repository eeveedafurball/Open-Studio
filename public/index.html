<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="WebDAW is a portable music composition and production environment that runs in your browser." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo-192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Open!Studio</title>
    
    <!-- Default theme -->
    <link id="theme-style" rel="stylesheet" href="%PUBLIC_URL%/themes/default.css" />
    
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const savedTheme = localStorage.getItem("theme") || "default.css";
        const themeLink = document.getElementById("theme-style");
        themeLink.href = `%PUBLIC_URL%/themes/${savedTheme}`;
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
